version: "3.8"

services:
  telestore:
    build: .
    ports:
      - "9500:9500"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - CHANNEL_ID=${CHANNEL_ID}
      - BASE_URL=${BASE_URL:-http://localhost:9500}
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
      - SESSION_STRING=${SESSION_STRING:-}
      # 🔐 No default fallback — Coolify env me set karo (rotated keys!)
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - PORT=${PORT:-9500}
      # ☁️ Cloudflare R2 + CF worker mgmt (Coolify env se)
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_ACCESS_KEY=${R2_ACCESS_KEY}
      - R2_SECRET_KEY=${R2_SECRET_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-urlking}
      - CLOUDFLARE_TOKEN=${CLOUDFLARE_TOKEN}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - GOOGLE_SAFE_BROWSING_API_KEY=${GOOGLE_SAFE_BROWSING_API_KEY}
    volumes:
      - telestore-data:/app/data
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Gzip compression band — Content-Length preserve hoga
      - "traefik.http.middlewares.telestore-nogzip.compress=false"
      # Buffering band — direct stream browser tak
      - "traefik.http.middlewares.telestore-headers.headers.customResponseHeaders.X-Accel-Buffering=no"
      - "traefik.http.middlewares.telestore-headers.headers.customResponseHeaders.Accept-Ranges=bytes"
      - "traefik.http.routers.telestore.middlewares=telestore-nogzip,telestore-headers"

volumes:
  telestore-data:
